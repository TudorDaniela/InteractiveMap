<div class="world-map-container">
  <div class="map-header">
    <h2>Interactive World Map</h2>
    <div class="stats">
      <p>Visited: <strong>{{ visitedCountries.size }}/{{ countries.length }}</strong> countries</p>
      <div class="progress-bar">
        <div class="progress-fill" [style.width.%]="getVisitedPercentage()"></div>
      </div>
    </div>
  </div>

  <div *ngIf="mapError" class="error">{{ mapError }}</div>
  <div #mapContainer class="map-container"></div>

</div>
